<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Mystery Gift 🎁</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Playfair+Display:wght@700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ===== COLORS: change the palette here ===== */
:root{--pink:#ff9ecb;--purple:#a77bff;--navy:#0b1030;--gold:#ffd36b}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;color:#fff;font-family:'Poppins',system-ui,sans-serif;background:radial-gradient(ellipse at 50% 30%,#2a1458,#120a38 55%,#070a20)}
#fx{position:fixed;inset:0;z-index:9;pointer-events:none}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:clamp(10px,2.4vh,20px);padding:16px;text-align:center;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .9s,visibility .9s}
.stage.active{opacity:1;visibility:visible}
.stage>:not(.bgl){position:relative;z-index:2}
.bgl{position:absolute;inset:0;z-index:0;pointer-events:none}
.ttl{font:700 clamp(26px,7vw,44px) 'Playfair Display',serif;background:linear-gradient(90deg,#ffe28a,#ffb3d9,#c9a6ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px #ffd36b66)}
.cap{font:600 clamp(21px,5.6vw,32px) 'Dancing Script',cursive;color:#ffe7f3;text-shadow:0 0 14px #ff9ecb99}
.sub{max-width:520px;font-size:clamp(14px,3.6vw,17px);line-height:1.65;color:#f1e6ff}
.btn{font:600 clamp(15px,4vw,18px) 'Poppins',sans-serif;color:#2b1650;padding:14px 28px;border:0;border-radius:999px;cursor:pointer;background:linear-gradient(135deg,#ffe28a,#ffb3d9 60%,#c9a6ff);box-shadow:0 0 22px #ffd36b88,0 6px 18px #0006;animation:pulse 2s ease-in-out infinite;transition:transform .2s}
.btn:hover{transform:scale(1.05)}.btn:focus-visible,.gift:focus-visible{outline:3px solid #fff;outline-offset:4px}
.btn:disabled{animation:none;filter:grayscale(.5) brightness(.8);cursor:default;transform:none}
.btn.sm{font-size:14px;padding:9px 18px}
@keyframes pulse{50%{box-shadow:0 0 38px 8px #ffd36bbb,0 6px 18px #0006}}
.later{opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity .9s,transform .9s}
.later.show{opacity:1;pointer-events:auto;transform:none}

/* ===== PAGE 1: 3D GIFT BOX ===== */
.scene{width:260px;height:260px;perspective:900px;display:grid;place-items:center;position:relative;transition:opacity 1.2s,transform 1.2s}
.scene.gone{opacity:0;transform:scale(.6) translateY(-30px)}
.halo{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:radial-gradient(circle,#ffe28af2,#ffa0dc66 40%,transparent 70%);opacity:0;transform:scale(.3);transition:opacity 1s,transform 1.4s}
.halo.on{opacity:1;transform:scale(1.3)}
.plat{position:absolute;bottom:55px;left:50%;width:230px;height:40px;margin-left:-115px;border-radius:50%;background:radial-gradient(ellipse,#ffd36b99,#a77bff40 60%,transparent 72%);animation:pulse2 3s ease-in-out infinite}
@keyframes pulse2{50%{opacity:.55}}
.gift{position:relative;width:150px;height:110px;transform-style:preserve-3d;transform:rotateX(-18deg) rotateY(30deg);animation:sway 6s ease-in-out infinite;cursor:pointer;outline:none}
.gift.open{animation-play-state:paused}
@keyframes sway{0%,100%{transform:rotateX(-18deg) rotateY(24deg)}50%{transform:rotateX(-18deg) rotateY(38deg) translateY(-8px)}}
.body,.lid{transform-style:preserve-3d}
.body{--z:75px;position:absolute;inset:0}
.lid{--z:82px;position:absolute;left:-7px;top:-36px;width:164px;height:36px;transform-origin:50% 100% -82px;transition:transform 1.4s cubic-bezier(.3,1.3,.5,1)}
.open .lid{transform:rotateX(112deg) translateY(-6px)}
.f{position:absolute;left:0;top:0;background:linear-gradient(115deg,#ffffff59,transparent 40%),linear-gradient(135deg,#ff8fc4,#b57bff)}
.body .f{width:150px;height:110px}.lid .f{width:164px;height:36px;background:linear-gradient(115deg,#ffffff66,transparent 40%),linear-gradient(135deg,#ff9fd0,#9b6bff)}
.f::before{content:'';position:absolute;inset:0 auto 0 50%;width:26px;margin-left:-13px;background:linear-gradient(90deg,#c9942b,#ffe08a,#c9942b);transition:transform 1s,opacity 1s}
.open .f::before{transform:scaleX(.5);opacity:.5}
.fF{transform:translateZ(var(--z))}.fB{transform:rotateY(180deg) translateZ(var(--z))}.fR{transform:rotateY(90deg) translateZ(var(--z))}.fL{transform:rotateY(-90deg) translateZ(var(--z))}
.body .in{height:150px;top:-20px;width:150px;transform:rotateX(90deg) translateZ(55px);background:radial-gradient(#7a3fd0,#2a1458)}
.body .in::before{display:none}
.open .in{background:radial-gradient(#fff6c8,#ffd36b 50%,#b8741a);transition:background 1s}
.lid .tp{width:164px;height:164px;top:-64px;transform:rotateX(90deg) translateZ(18px)}
.tp::after{content:'';position:absolute;inset:50% 0 auto;height:26px;margin-top:-13px;background:linear-gradient(#c9942b,#ffe08a,#c9942b)}
.bow{position:absolute;left:50%;top:-44px;width:96px;height:48px;margin-left:-48px;transition:transform 1.2s,opacity 1.2s}
.open .bow{transform:translateY(-26px) rotate(18deg) scale(1.15);opacity:0}
.lp{position:absolute;top:2px;width:44px;height:36px;border-radius:50%;border:6px solid #e0aa3a;background:radial-gradient(#fff0b0,#ffd36b);box-shadow:0 0 12px #ffd36b99}
.lp.l{left:0;transform:rotate(-24deg)}.lp.r{right:0;transform:rotate(24deg)}
.kn{position:absolute;left:50%;top:14px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:radial-gradient(#fff6c8,#e0aa3a)}

/* ===== PAGE 2: LAYERED CAKE ===== */
.cakewrap{position:relative;width:240px;height:262px;opacity:0;transform:translateY(40px) scale(.85);transition:opacity 1.4s,transform 1.4s cubic-bezier(.2,1.2,.4,1)}
#s2.active .cakewrap{opacity:1;transform:none;animation:bob 4s ease-in-out 1.5s infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.cakewrap::before{content:'';position:absolute;left:50%;top:0;width:300px;height:300px;margin-left:-150px;border-radius:50%;background:radial-gradient(circle,#ffb34766,transparent 62%);transition:opacity 1s;animation:halo2 1.6s ease-in-out infinite alternate}
@keyframes halo2{to{opacity:.6}}
.cakewrap.blown::before{opacity:0;animation:none}
.cake{position:absolute;inset:0;transform-origin:50% 100%;scale:var(--k,1);transition:filter .6s}
.cakewrap.glow .cake{filter:drop-shadow(0 0 26px #ffaadcb3)}
.plate{position:absolute;left:4px;bottom:0;width:232px;height:36px;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#fff,#eadcff 55%,#b79cf0);box-shadow:0 14px 26px #0008,inset 0 -4px 8px #7a5cc055}
.tier{position:absolute;border-radius:12px 12px 14px 14px;box-shadow:inset 12px 0 16px #ffffff2e,inset -14px 0 18px #0000002e,0 6px 10px #0004}
.tier::before{content:'';position:absolute;left:0;right:0;top:-8px;height:18px;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#fff,var(--fr))}
.tier::after{content:'';position:absolute;left:0;right:0;top:0;height:26px;z-index:2;border-radius:12px 12px 0 0;background:linear-gradient(var(--fr),var(--fr)) 0 0/100% 10px no-repeat,radial-gradient(circle at 9px 8px,var(--fr) 9px,transparent 10px) 0 0/26px 20px repeat-x,radial-gradient(ellipse 6px 16px at 50% 6px,var(--fr) 94%,transparent) 0 0/42px 24px repeat-x}
.t1{left:20px;bottom:16px;width:200px;height:68px;background:linear-gradient(#ff9ec4,#ff74a8);--fr:#fff4f9;--pe:#fff}
.t2{left:46px;bottom:76px;width:148px;height:56px;background:linear-gradient(#fff3cf,#ffd88a);--fr:#ffc2dc;--pe:#ff8fba}
.t3{left:72px;bottom:124px;width:96px;height:48px;background:linear-gradient(#7d4b3b,#4a2a25);--fr:#fff0d9;--pe:#ffd36b}
.pearls{position:absolute;left:6px;right:6px;bottom:6px;height:10px;background:radial-gradient(circle,var(--pe) 3px,transparent 3.8px) 0 0/16px 10px repeat-x}
.lab{position:absolute;left:0;right:0;top:50%;z-index:1;transform:translateY(-32%);text-align:center;font:600 22px 'Dancing Script',cursive;color:#fff;text-shadow:0 1px 4px #b0306099}
.ch{position:absolute;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,#c4153c);box-shadow:0 2px 4px #0006}
.ch::after{content:'';position:absolute;left:7px;top:-8px;width:2px;height:9px;background:#3b7a3b;transform:rotate(18deg)}
.sp{position:absolute;width:7px;height:2.5px;border-radius:2px}
.candles{position:absolute;left:72px;bottom:166px;width:96px;height:70px}
.candle{position:absolute;bottom:0;width:10px;height:66px}
.candle:nth-child(1){left:14px}.candle:nth-child(2){left:43px}.candle:nth-child(3){left:72px}
.stick{position:absolute;bottom:0;width:10px;height:48px;border-radius:3px;background:repeating-linear-gradient(45deg,#fff 0 5px,#ff9ecb 5px 10px)}
.candle:nth-child(2) .stick{background:repeating-linear-gradient(45deg,#fff 0 5px,#ffd36b 5px 10px)}
.candle:nth-child(3) .stick{background:repeating-linear-gradient(45deg,#fff 0 5px,#b99aff 5px 10px)}
.stick::before{content:'';position:absolute;left:4px;top:-6px;width:2px;height:6px;background:#333}
.flame{position:absolute;left:-1px;bottom:54px;width:12px;height:19px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(#fff,#ffd36b 50%,#ff8a3d);box-shadow:0 0 18px 7px #ffb34766;transform-origin:50% 100%;animation:flick .15s ease-in-out infinite alternate}
.candle:nth-child(2) .flame{animation-delay:-.07s}
@keyframes flick{to{transform:scale(1.08,.94) rotate(3deg)}}
.flame.wind{animation:wind .9s ease-in-out forwards}
@keyframes wind{0%{transform:rotate(0)}30%{transform:rotate(-40deg) scaleY(.7)}55%{transform:rotate(28deg) scaleY(.5)}80%{transform:rotate(-30deg) scaleY(.35)}100%{transform:rotate(0) scaleY(.2)}}
.flame.out{animation:none;opacity:0;transform:scale(0);transition:.5s}
.smoke{position:absolute;left:0;bottom:56px;width:10px;height:10px;border-radius:50%;background:#dcdcebb3;filter:blur(3px);opacity:0;animation:smoke 2.2s ease-out forwards}
@keyframes smoke{10%{opacity:.7}to{opacity:0;transform:translate(var(--x),-120px) scale(3.2)}}
.wish{font:600 clamp(24px,6vw,34px) 'Dancing Script',cursive;color:var(--gold);text-shadow:0 0 16px #ffd36b;opacity:0;transform:scale(.5);transition:opacity .6s,transform .8s cubic-bezier(.3,1.8,.5,1);min-height:1.4em}
.wish.show{opacity:1;transform:none}
@media (max-height:700px){.cake{--k:.86}.cakewrap{margin-top:-30px}}
@media (max-height:580px){.cake{--k:.72}.cakewrap{margin-top:-66px}}
h2.cap{font-size:clamp(24px,6.4vw,38px)}

/* ===== PAGE 3: GALAXY ===== */
#gal{width:100%;height:100%;display:block}
.par{position:absolute;transform:translate3d(calc(var(--px,0)*var(--d)*1px),calc(var(--py,0)*var(--d)*1px),0)}
.neb{border-radius:50%;filter:blur(34px);opacity:.5;animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(30px,-24px) scale(1.15)}}
.pl{border-radius:50%}
.planet{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;box-shadow:inset -14px -10px 26px #000a,0 0 30px var(--c1)}
.planet::before{content:'';position:absolute;top:0;bottom:0;left:0;width:300%;background:repeating-linear-gradient(100deg,var(--c1) 0 15px,var(--c2) 15px 30px);animation:spin 14s linear infinite}
@keyframes spin{to{transform:translateX(-60px)}}
.ring{position:absolute;left:-32%;right:-32%;top:38%;height:24%;border:3px solid #ffdc9699;border-radius:50%;transform:rotate(-18deg)}
.flash{background:radial-gradient(circle at 50% 37%,#fff,#ff96d29a 30%,transparent 65%);opacity:0;transition:opacity .5s}
.flash.on{opacity:.9}
.gtxt{display:flex;flex-direction:column;gap:6px;margin-top:auto}
#s3{justify-content:flex-end;padding-bottom:5vh}
.gtxt .cap:last-child{font-size:clamp(26px,7vw,40px);color:#fff}

/* ===== PAGE 4: LOVE TREE ===== */
#s4{padding:12px 16px;gap:clamp(4px,1.4vh,12px)}
.garden{background:linear-gradient(#050a28,#1a1250 55%,#2d1a60 80%)}
.moon{position:absolute;right:8%;top:5%;width:clamp(44px,9vw,70px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#ffe9a8);box-shadow:0 0 50px 14px #ffe9a866}
.moon::before{content:'';position:absolute;left:30%;top:26%;width:22%;height:22%;border-radius:50%;background:#e8d68a55}
.moon::after{content:'';position:absolute;left:58%;top:56%;width:15%;height:15%;border-radius:50%;background:#e8d68a44}
.gs{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 30% 8%,#fff,transparent),radial-gradient(1px 1px at 52% 22%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 12%,#fff,transparent),radial-gradient(1px 1px at 88% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 20% 40%,#fff,transparent),radial-gradient(1px 1px at 80% 48%,#fff,transparent);animation:tw 3.6s ease-in-out infinite alternate}
.gs2{background-image:radial-gradient(1px 1px at 6% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 24% 24%,#ffe9a8,transparent),radial-gradient(1px 1px at 42% 10%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 34%,#fff,transparent),radial-gradient(1px 1px at 76% 20%,#ffd7f0,transparent),radial-gradient(1.5px 1.5px at 94% 14%,#fff,transparent),radial-gradient(1px 1px at 40% 46%,#fff,transparent);animation-delay:1.8s}
@keyframes tw{from{opacity:.35}to{opacity:1}}
.shoot{position:absolute;top:14%;left:-10%;width:90px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff);opacity:0;animation:shoot 8s ease-in 3s infinite}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(24deg)}3%{opacity:1}12%{opacity:0;transform:translate(75vw,34vw) rotate(24deg)}100%{opacity:0}}
.hill{position:absolute;bottom:-14vh;left:-15%;width:130%;height:34vh;border-radius:50%;background:radial-gradient(ellipse at 50% 0,#1d5c4d,#0d3030 70%)}
.hill.h2{left:-35%;width:95%;bottom:-17vh;height:30vh;background:radial-gradient(ellipse at 50% 0,#17504a,#0b2a2c 70%)}
#tree{width:max(170px,min(92vw,calc((100vh - 310px)*.95),540px));width:max(170px,min(92vw,calc((100dvh - 310px)*.95),540px));height:auto;overflow:visible;flex:0 0 auto}
#tree .seedc{opacity:0;transform:scale(0);transition:.8s;transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 0 4px var(--gold))}
#tree.seed .seedc{opacity:1;transform:scale(1)}
#tree.glow .seedc{animation:sg 1s ease-in-out infinite}
@keyframes sg{50%{filter:drop-shadow(0 0 14px #fff2a0)}}
#tree .spr{opacity:0;transform:scaleY(0);transform-box:fill-box;transform-origin:bottom;transition:.9s}
#tree.sprout .spr{opacity:1;transform:none}
#tree.g1 .spr,#tree.g1 .seedc{opacity:0;transition:.8s .6s}
.tr,.br{stroke-dasharray:1 1;stroke-dashoffset:1}
.tr{transition:stroke-dashoffset 2.3s ease-in-out}.br{transition:stroke-dashoffset 1.5s ease-in-out}
#tree.g1 .tr,#tree.g2 .br{stroke-dashoffset:0}
#cg{opacity:0;transition:opacity 2.8s}#tree.g3 #cg{opacity:1}
.lv,.ht{transform:scale(0);transform-box:fill-box;transform-origin:0 50%;transition:transform .7s cubic-bezier(.3,1.6,.5,1)}
.ht{transform-origin:center;fill:url(#hg);transition-duration:.9s}
#tree.g3 .lv{transform:scale(1)}#tree.g4 .ht{transform:scale(var(--s,1))}
.hearts{filter:drop-shadow(0 0 4px #ff8fc4);animation:hp 2.6s ease-in-out infinite}
@keyframes hp{50%{opacity:.78}}
#tree .tstar{fill:#fff6c8;opacity:0;transform:scale(0);transform-box:fill-box;transform-origin:center;transition:transform 1s cubic-bezier(.3,1.6,.5,1),opacity 1s;filter:drop-shadow(0 0 6px #ffe28a)}
#tree.g4 .tstar{opacity:1;transform:scale(1);animation:sg 1.6s ease-in-out 1s infinite}
#tree.g4 #cn{animation:swy 8s ease-in-out infinite;transform-origin:200px 400px}
@keyframes swy{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
.love{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:560px}
.th{visibility:hidden}
.typing>.tv::after{content:'|';margin-left:2px;animation:cur .5s infinite alternate}
@keyframes cur{to{opacity:0}}
.foot{font:600 clamp(20px,5.2vw,26px) 'Dancing Script',cursive;color:var(--pink);opacity:0;transition:opacity 1.2s}
.foot.show{opacity:1}
@media (orientation:landscape) and (max-height:540px){
  #s4{flex-direction:row;gap:3vw;padding:10px 4vw}
  #tree{width:min(44vw,calc(100vh - 24px));width:min(44vw,calc(100dvh - 24px))}
  .love{max-width:46vw;gap:6px}
  .love .cap{font-size:clamp(20px,4.2vw,28px)}
  .love .sub{font-size:13px;line-height:1.5}
  .foot{font-size:20px}
}
/* ===== MUSIC BUTTON ===== */
#mus{position:fixed;z-index:20;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));width:44px;height:44px;border-radius:50%;border:1px solid #ffffff44;background:#ffffff1a;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 0 14px #a77bff55}
#mus.hint{animation:pulse 2s ease-in-out infinite}
#mus:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.gift,.btn,.flame,.neb,.planet::before,.plat,.hearts,.cakewrap,.cakewrap::before,#mus,.shoot,.gs,#cn,.tstar{animation:none!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<button id="mus" type="button" aria-label="Play music">🎵</button>

<!-- ===== PAGE 1 ===== -->
<section class="stage active" id="s1" aria-label="The Mystery Gift">
  <h1 class="ttl">The Mystery Gift 🎁</h1>
  <p class="cap" id="t1"></p>
  <div class="scene" id="scene">
    <div class="halo" id="halo"></div>
    <div class="plat"></div>
    <div class="gift" id="gift" role="button" tabindex="0" aria-label="Open the mystery gift box">
      <div class="body"><i class="f fF"></i><i class="f fB"></i><i class="f fR"></i><i class="f fL"></i><i class="f in"></i></div>
      <div class="lid"><i class="f fF"></i><i class="f fB"></i><i class="f fR"></i><i class="f fL"></i><i class="f tp"></i>
        <div class="bow"><i class="lp l"></i><i class="lp r"></i><i class="kn"></i></div></div>
    </div>
  </div>
  <p class="sub" id="t2"></p>
</section>

<!-- ===== PAGE 2 ===== -->
<section class="stage" id="s2" aria-label="Birthday cake">
  <div class="cakewrap" id="cakewrap">
    <div class="cake">
      <div class="plate"></div>
      <div class="tier t1"><span class="pearls"></span><b class="lab">Happy Birthday</b></div>
      <div class="tier t2"><span class="pearls"></span></div>
      <div class="tier t3"></div>
      <i class="ch" style="left:56px;bottom:127px"></i><i class="ch" style="left:170px;bottom:127px"></i>
      <div class="candles">
        <div class="candle"><div class="flame"></div><div class="stick"></div></div>
        <div class="candle"><div class="flame"></div><div class="stick"></div></div>
        <div class="candle"><div class="flame"></div><div class="stick"></div></div>
      </div>
    </div>
  </div>
  <h2 class="cap" id="t3"></h2>
  <p class="sub" id="t4"></p>
  <p class="wish" id="wish" aria-live="polite">Wish made! 💫</p>
  <button class="btn" id="blow">🕯️ Blow the Candle</button>
  <button class="btn later" id="n2" disabled>Next Surprise ✨</button>
</section>

<!-- ===== PAGE 3 ===== -->
<section class="stage" id="s3" aria-label="Galaxy of love">
  <div class="bgl" id="lay"></div>
  <canvas class="bgl" id="gal" aria-hidden="true"></canvas>
  <div class="bgl flash" id="flash"></div>
  <div class="gtxt later" id="gt"><p class="cap" id="t5"></p><p class="cap" id="t6"></p></div>
  <button class="btn later" id="b3" disabled>Final Surprise 💖</button>
</section>

<!-- ===== PAGE 4 ===== -->
<section class="stage" id="s4" aria-label="Magical love tree">
  <div class="bgl garden"><div class="gs"></div><div class="gs gs2"></div><div class="moon"></div><i class="shoot"></i><div class="hill h2"></div><div class="hill"></div></div>
  <svg id="tree" viewBox="0 0 400 420" role="img" aria-label="A magical tree growing glowing heart leaves"></svg>
  <div class="love">
    <h2 class="cap" id="lt"></h2>
    <p class="sub" id="lm"></p>
    <p class="foot" id="ft"></p>
    <button class="btn sm later" id="rp" disabled>↻ Replay the surprise</button>
  </div>
</section>

<script>
/* ===== TEXT: change the recipient name, birthday message and love message here ===== */
const CONFIG={
  name:'Thango', // ← recipient's name
  intro:'Someone has a little surprise for you… 🥹💗',
  hint:'Tap the gift to reveal your magic ✨',

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches,MOB=innerWidth<700;
let run=0,busy=0,mode='a';
const D=ms=>RM?ms*.4:ms;
const S=ms=>{const t=run;return new Promise((res,rej)=>setTimeout(()=>t===run?res():rej('x'),D(ms)))};
const safe=f=>(...a)=>f(...a).catch(()=>{});
const COL=['#ffd36b','#ffb3d9','#c9a6ff','#fff3b0','#ff8fc4'];
const R=Math.random;

/* ===== BIRTHDAY MUSIC: music-box "Happy Birthday" made with Web Audio (no file needed) ===== */
const BGM=(()=>{
  const BEAT=.62,LOOP=27,VOL=.55;
  const mf=m=>440*Math.pow(2,(m-69)/12);
  const tune=[[67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2],[67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2],[67,.75],[67,.25],[79,1],[76,1],[72,1],[71,1],[69,1],[77,.75],[77,.25],[76,1],[72,1],[74,1],[72,2]];
  const CH={C:[48,[55,64]],G:[43,[50,59]],F:[41,[48,57]]},bars='CGGCCFFC';
  const EV=[];let bt=0;
  tune.forEach(([m,d])=>{EV.push({b:bt,m,k:'m'});bt+=d});
  [...bars].forEach((c,i)=>{const [r,ns]=CH[c];EV.push({b:i*3,m:r,k:'b'},{b:i*3+1,m:ns[0],k:'c'},{b:i*3+2,m:ns[1],k:'c'})});
  EV.sort((x,y)=>x.b-y.b);
  let ac,out,timer,loopT=0,idx=0,started=0,muted=0,el=null;
  function mk(){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ac.createDynamicsCompressor(),rev=ac.createConvolver(),wet=ac.createGain(),n=Math.floor(ac.sampleRate*2.2),buf=ac.createBuffer(2,n,ac.sampleRate);
    out=ac.createGain();out.gain.value=0;wet.gain.value=.38;
    for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let k=0;k<n;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/n,2.6)}
    rev.buffer=buf;out.connect(comp);out.connect(rev);rev.connect(wet);wet.connect(comp);comp.connect(ac.destination);
  }
  function note(m,t,k){
    const f=mf(m),v=k==='m'?.26:k==='b'?.15:.08,d=k==='m'?1.5:k==='b'?1.3:.9;
    [[1,1,1],[2,.3,.55],[5.04,.07,.25]].forEach(([h,a,dc])=>{
      const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f*h;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v*a,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d*dc);
      o.connect(g);g.connect(out);o.start(t);o.stop(t+d*dc+.05)});
  }
  function tick(){
    const now=ac.currentTime;
    for(;;){const e=EV[idx],t=loopT+e.b*BEAT;if(t>now+.7)break;if(t>=now-.03)note(e.m,Math.max(t,now),e.k);if(++idx>=EV.length){idx=0;loopT+=LOOP*BEAT}}
  }
  function ui(){
    const b=$('#mus');b.textContent=!started?'🎵':muted?'🔇':'🔊';b.classList.toggle('hint',!started);
    b.setAttribute('aria-label',!started?'Play music':muted?'Unmute music':'Mute music');
  }
  function start(){
    if(started)return;started=1;
    if(CONFIG.bgmFile){
      el=new Audio(CONFIG.bgmFile);el.loop=true;el.volume=.6;
      el.onerror=()=>{el=null;started=0;CONFIG.bgmFile='';start()};
      el.play().catch(()=>{});ui();return;
    }
    try{mk()}catch(e){started=0;return}
    ac.resume&&ac.resume();loopT=ac.currentTime+.2;idx=0;
    out.gain.setTargetAtTime(VOL,ac.currentTime,.4);
    timer=setInterval(tick,120);tick();ui();
  }
  function toggle(){
    if(!started){start();return}
    muted=!muted;
    if(el)el.muted=muted;else out.gain.setTargetAtTime(muted?0:VOL,ac.currentTime,.15);
    ui();
  }
  function fx(ms){if(!started||muted||!ac)return;const t=ac.currentTime+.02;ms.forEach((m,k)=>note(m,t+k*.09,'m'))}
  const kick=e=>{
    if(e.target.closest&&e.target.closest('#mus'))return;
    if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ')return;
    if(started){if(ac&&ac.state==='suspended'&&!document.hidden)ac.resume();return}
    start();
  };
  ['click','touchend','keydown'].forEach(ev=>document.addEventListener(ev,kick,true));
  document.addEventListener('visibilitychange',()=>{
    if(!started)return;
    if(el){document.hidden?el.pause():el.play().catch(()=>{})}
    else if(ac){document.hidden?ac.suspend():ac.resume()}
  });
  $('#mus').onclick=toggle;ui();
  return{start,toggle,fx};
})();

}

/* ===== PARTICLES (one canvas; capped for mobile) ===== */
const fx=$('#fx'),c=fx.getContext('2d'),gal=$('#gal'),g=gal.getContext('2d');
let W,H,dpr,P=[];const CAP=MOB?130:240;
function add(o){if(P.length>CAP)P.shift();P.push(Object.assign({x:0,y:0,vx:0,vy:0,g:0,d:1,l:0,m:2,s:6,t:'s',c:'#fff',r:0,vr:0,a:1},o))}
function drawP(dt){
  const k=dt*60;c.textAlign='center';c.textBaseline='middle';
  for(let i=P.length-1;i>=0;i--){
    const p=P[i];p.l+=dt;if(p.l>=p.m){P.splice(i,1);continue}
    p.vy+=p.g*k;const dr=Math.pow(p.d,k);p.vx*=dr;p.x+=p.vx*k;p.y+=p.vy*k;p.r+=p.vr*k;
    c.globalAlpha=Math.max(0,Math.min(1,p.l*2.5,(p.m-p.l)*1.3))*p.a;c.fillStyle=p.c;
    if(p.t==='c'){c.beginPath();c.arc(p.x,p.y,p.s/2,0,6.3);c.fill()}
    else if(p.t==='r'){c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore()}
    else{c.font=`${p.s*1.6}px serif`;c.fillText(p.t==='h'?'♥':'✦',p.x,p.y)}
  }
  c.globalAlpha=1;
}
let acc=0;
function amb(dt){
  if(!mode)return;acc+=dt*(RM?2:MOB?5:9);
  while(acc>1){acc--;const h=R()<.22;
    if(mode==='garden')add({x:W*(.15+R()*.7),y:H*(.35+R()*.55),vx:(R()-.5)*.3,vy:-.25-R()*.4,m:5+R()*4,s:h?7+R()*7:4+R()*6,t:h?'h':'s',c:h?'#ff8fc4':'#ffd36b',a:.85});
    else add({x:R()*W,y:H+10,vx:(R()-.5)*.4,vy:-.6-R()*.9,m:9+R()*5,s:h?6+R()*7:4+R()*6,t:h?'h':'s',c:h?'#ff9ecb':COL[(R()*4)|0],a:.8});
  }
}
let pacc=0,petals=0;
function fall(dt){
  if(!petals||mode!=='garden')return;pacc+=dt*(RM?1:MOB?2.2:3.5);
  while(pacc>1){pacc--;const r=$('#tree').getBoundingClientRect();
    add({x:r.left+r.width*(.2+R()*.6),y:r.top+r.height*(.1+R()*.35),vx:(R()-.5)*.6,vy:.35+R()*.5,m:5+R()*3,s:5+R()*6,t:'h',c:R()<.5?'#ff9ecb':'#ffc2e0',a:.9})}
}
function burst(x,y,n){
  if(RM)n=n/2;
  for(let i=0;i<n;i++){const a=R()*6.283,v=2+R()*8;
    add({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:.12,d:.975,m:1.4+R()*1.6,s:5+R()*9,t:['s','h','c','s'][i%4],c:COL[i%5]})}
}
function pop(){
  for(const side of [0,1])for(let i=0;i<(MOB?30:55);i++){const d=side?-1:1;
    add({x:side?W+5:-5,y:H*(.35+R()*.55),vx:d*(3+R()*8),vy:-(5+R()*10),g:.22,d:.985,m:2.4+R()*1.6,s:6+R()*8,t:['r','h','s','c'][i%4],c:COL[i%5],r:R()*6,vr:(R()-.5)*.4})}
}

/* ===== GALAXY (page 3) ===== */
let stars=[],hp=[],orb=[],cx,cy,sc,galOn=0,gT0=0,shine=0,shineOn=0,ox=0,oy=0,tx0=0,ty0=0,ptr=0,txtOn=0,btnOn=0;
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x),lerp=(a,b,t)=>a+(b-a)*t;
function buildGalaxy(){
  const n=MOB?650:1500,cl=['#fff','#ffd7f0','#cfd8ff'];
  stars=Array.from({length:n},()=>({x:R()*W,y:R()*H,r:R()*1.6+.4,p:R()*6.28,s:.6+R()*2,c:cl[R()<.2?1:R()<.2?2:0]})).sort((a,b)=>a.c<b.c?-1:1);
  const n1=MOB?130:190,n2=MOB?150:300;cx=W/2;cy=H*.37;sc=Math.min(W*.82/34,H*.5/32);
  const hx=t=>16*Math.sin(t)**3,hy=t=>13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
  hp=[];
  for(let i=0;i<n1;i++){const t=i/n1*6.283;hp.push({k:0,hx:hx(t),hy:hy(t)})}
  for(let i=0;i<n2;i++){const t=R()*6.283,r=Math.sqrt(R())*.93;hp.push({k:1,hx:hx(t)*r,hy:hy(t)*r})}
  hp.forEach(p=>{p.tx=cx+p.hx*sc;p.ty=cy-p.hy*sc;p.sx=R()*W;p.sy=R()*H;p.bx=cx+(R()-.5)*40;p.by=cy+(R()-.5)*40;p.ph=R()*6.28;p.sz=.9+R()*1.5;p.c=p.k?COL[(R()*5)|0]:'#ffe3f3'});
  orb=Array.from({length:26},(_,i)=>({a:i/26*6.283,sp:.35+R()*.4,rr:.9+R()*.5}));
}
function buildLayers(){
  const L=$('#lay');L.innerHTML='';const m=MOB?.7:1;
  [[10,15,320,'#7a3cff',16],[70,55,360,'#ff5fa8',24],[40,75,300,'#3a6cff',12],[85,10,260,'#b04aff',20]].forEach(([x,y,s,col,d])=>{
    L.insertAdjacentHTML('beforeend',`<div class="par" style="--d:${d};left:${x}%;top:${y}%"><div class="neb" style="width:${s*m}px;height:${s*m}px;margin:-${s*m/2}px;background:radial-gradient(${col},transparent 70%)"></div></div>`)});
  [[9,14,86,'#8ab0ff','#3b4fd0',40,0],[84,22,58,'#ffc08a','#e0607a',55,1],[80,74,38,'#9af0d0','#2a8a8a',30,0],[14,70,30,'#ffd7a0','#b86a3a',26,0]].forEach(([x,y,s,c1,c2,d,ring])=>{
    L.insertAdjacentHTML('beforeend',`<div class="par" style="--d:${d};left:${x}%;top:${y}%;width:${s*m}px;height:${s*m}px;--c1:${c1};--c2:${c2}"><div class="planet"></div>${ring?'<i class="ring"></i>':''}</div>`)});
}
function drawGal(now,dt){
  const t=(now-gT0)/1000*(RM?3:1);
  g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  if(!ptr){tx0=Math.sin(t*.2)*.4;ty0=Math.cos(t*.17)*.3}
  ox+=(tx0-ox)*.05;oy+=(ty0-oy)*.05;
  $('#s3').style.setProperty('--px',ox*2);$('#s3').style.setProperty('--py',oy*2);
  let cur='';
  for(const s of stars){if(s.c!==cur){g.fillStyle=s.c;cur=s.c}g.globalAlpha=.35+.65*Math.abs(Math.sin(t*s.s+s.p));g.fillRect(s.x+ox*s.r*8,s.y+oy*s.r*8,s.r,s.r)}
  if(shineOn)shine=Math.min(1,shine+dt*1.1);
  const p1=ease(t/2.2),p2=ease((t-2.2)/2.6),p3=ease((t-4.8)/3.2),pu=t>8?1+.035*Math.sin((t-8)*2.8):1;
  const Rr=sc*24*pu,a=Math.min(1,.18*p3+.55*shine),gr=g.createRadialGradient(cx,cy,0,cx,cy,Rr*(1+shine*.6));
  gr.addColorStop(0,`rgba(255,120,190,${a})`);gr.addColorStop(1,'rgba(120,70,255,0)');
  g.globalAlpha=1;g.fillStyle=gr;g.fillRect(cx-Rr*2,cy-Rr*2,Rr*4,Rr*4);
  for(const p of hp){
    const pr=p.k?p3:p2;let x=lerp(lerp(p.sx,p.bx,p1),p.tx,pr),y=lerp(lerp(p.sy,p.by,p1),p.ty,pr);
    x=cx+(x-cx)*pu+Math.sin(t*1.5+p.ph)*1.2;y=cy+(y-cy)*pu+Math.cos(t*1.3+p.ph);p.x=x;p.y=y;
    g.globalAlpha=.55+.45*Math.sin(t*2+p.ph)**2;g.fillStyle=p.c;g.beginPath();g.arc(x,y,(p.sz+shine*1.2)*(p.k?1:1.3),0,6.3);g.fill();
  }
  if(p2>.3){const n1=MOB?130:190;g.globalAlpha=1;g.strokeStyle=`rgba(255,200,235,${.22*p2+.2*shine})`;g.lineWidth=.8;g.beginPath();
    for(let i=0;i<n1;i++){const q=hp[i],b=hp[(i+1)%n1],e=hp[(i+4)%n1];g.moveTo(q.x,q.y);g.lineTo(b.x,b.y);g.moveTo(q.x,q.y);g.lineTo(e.x,e.y)}g.stroke()}
  const o=ease((t-8.2)/1.5);
  if(o>0)for(const q of orb){const an=q.a+t*q.sp,ex=Math.cos(an)*sc*21*q.rr,ey=Math.sin(an)*sc*8*q.rr,x=cx+ex*.94+ey*.34,y=cy-ex*.34+ey*.94;
    g.fillStyle='#ffd36b';g.globalAlpha=o*.25;g.beginPath();g.arc(x,y,6,0,6.3);g.fill();g.globalAlpha=o;g.beginPath();g.arc(x,y,2.3,0,6.3);g.fill()}
  g.globalAlpha=1;
  if(t>7&&!txtOn){txtOn=1;$('#gt').classList.add('show')}
  if(t>9.2&&!btnOn){btnOn=1;const b=$('#b3');b.disabled=false;b.classList.add('show')}
}
$('#s3').addEventListener('pointermove',e=>{ptr=1;tx0=e.clientX/W-.5;ty0=e.clientY/H-.5});

/* ===== MAIN LOOP & RESIZE ===== */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  amb(dt);fall(dt);drawP(dt);if(galOn)drawGal(now,dt);
  requestAnimationFrame(loop);
}
function resize(){
  dpr=Math.min(devicePixelRatio||1,MOB?1.5:2);W=innerWidth;H=innerHeight;
  [fx,gal].forEach(k=>{k.width=W*dpr;k.height=H*dpr});buildGalaxy();
}

/* ===== STAGE FLOW ===== */
async function go(n){
  const cur=$('.stage.active');cur&&cur.classList.remove('active');
  await S(800);$('#s'+n).classList.add('active');
  if(n===3){mode=0;galOn=1;gT0=performance.now();buildLayers()}
  if(n===4){galOn=0;mode='garden';grow().catch(()=>{})}
  if(n<3)mode='a';
}
/* Page 1: open the gift */

  const r=$('#gift').getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;

});

  <g id="cn">
  <path class="tr" pathLength="1" d="M200 398C184 397 168 401 150 407" stroke="#6b4423" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path class="tr" pathLength="1" d="M200 398C216 398 234 402 252 407" stroke="#6b4423" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path class="tr" pathLength="1" d="M199 399C196 404 192 408 186 412" stroke="#6b4423" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path class="tr" pathLength="1" d="M200 398C196 345 206 300 200 252C196 214 204 182 200 140" stroke="url(#tg)" stroke-width="15" fill="none" stroke-linecap="round"/>
  <path class="tr" pathLength="1" d="M196 396C192 345 202 300 196 252C192 214 200 182 197 144" stroke="#d9a86c" stroke-width="3" fill="none" stroke-linecap="round" opacity=".45"/>`+
  br.map((d,i)=>`<path class="br" pathLength="1" d="${d}" style="transition-delay:${(i*.16).toFixed(2)}s" stroke="#7a4c28" stroke-width="${Math.max(2.2,7-i*.45).toFixed(1)}" fill="none" stroke-linecap="round"/>`).join('')+'<g id="lv"></g><g class="hearts" id="hs"></g><path class="tstar" d="M200 108L204 119L215 122L204 125L200 136L196 125L185 122L196 119Z"/></g>';
  let L='',Hh='';const nl=MOB?10:14,nh=5;
  $$('#tree .br').forEach((b,i)=>{const len=b.getTotalLength();
    for(let k=0;k<nl;k++){const p=b.getPointAtLength(len*(.3+.7*k/(nl-1)));
      L+=`<g transform="translate(${(p.x+(R()-.5)*26)|0} ${(p.y+(R()-.5)*26)|0}) rotate(${(R()*360)|0}) scale(${(.8+R()*.7).toFixed(2)})"><path class="lv" d="M0 0Q7-7 15 0Q7 7 0 0Z" fill="${LC[(R()*5)|0]}" style="transition-delay:${(i*.22+k*.09).toFixed(2)}s"/></g>`}
    for(let k=0;k<nh;k++){const p=b.getPointAtLength(len*(.4+.6*k/(nh-1)));
      Hh+=`<g transform="translate(${(p.x+(R()-.5)*22)|0} ${(p.y+(R()-.5)*22)|0}) rotate(${((R()-.5)*50)|0})"><path class="ht" d="M0 4C-10-4-6-11 0-6C6-11 10-4 0 4Z" style="--s:${(1+R()*.8).toFixed(2)};transition-delay:${(i*.25+k*.18).toFixed(2)}s"/></g>`}});
  $('#lv').innerHTML=L;$('#hs').innerHTML=Hh;
}
/* reserve the text space up front so the layout never jumps while typing */
function reserve(){
  [['#lt',CONFIG.loveTitle(CONFIG.name)],['#lm',CONFIG.loveMsg]].forEach(([q,tx])=>{const e=$(q);e.classList.remove('typing');e.innerHTML='<span class="th"></span>';e.firstChild.textContent=tx});
  $('#ft').textContent=CONFIG.footer;
}
async function typeTo(el,txt,sp){
  const a=Array.from(txt);el.innerHTML='<span class="tv"></span><span class="th"></span>';
  const tv=el.firstChild,th=el.lastChild;el.classList.add('typing');
  for(let i=0;i<a.length;i++){tv.textContent=a.slice(0,i+1).join('');th.textContent=a.slice(i+1).join('');await S(sp)}
  el.classList.remove('typing');el.textContent=txt;
}
async function grow(){
  const t=$('#tree');await S(60);
  t.classList.add('seed');await S(1300);t.classList.add('glow');await S(1100);t.classList.add('sprout');await S(900);
  t.classList.add('g1');await S(2200);t.classList.add('g2');await S(2800);t.classList.add('g3');await S(3000);t.classList.add('g4');await S(1800);petals=1;
  await typeTo($('#lt'),CONFIG.loveTitle(CONFIG.name),60);await S(300);
  await typeTo($('#lm'),CONFIG.loveMsg,28);await S(400);
  $('#ft').classList.add('show');await S(1200);
  const r=$('#rp');r.disabled=false;r.classList.add('show');
}

/* ===== REPLAY ===== */
function resetAll(){
  $('#gift').classList.remove('open');$('#halo').classList.remove('on');$('#scene').classList.remove('gone');
  $$('.flame').forEach(f=>f.className='flame');$$('.smoke').forEach(s=>s.remove());
  $('#cakewrap').classList.remove('glow','blown');$('#wish').classList.remove('show');$('#blow').disabled=false;
  const n=$('#n2');n.disabled=true;n.classList.remove('show');
  $('#gt').classList.remove('show');const b=$('#b3');b.disabled=true;b.classList.remove('show');$('#flash').classList.remove('on');
  shine=0;shineOn=0;txtOn=0;btnOn=0;ptr=0;galOn=0;petals=0;
  reserve();$('#ft').classList.remove('show');
  const r=$('#rp');r.disabled=true;r.classList.remove('show');buildTree();
}
$('#rp').onclick=safe(async()=>{
  run++;mode=0;P.length=0;busy=0;$('#rp').disabled=true;
  $$('.stage').forEach(s=>s.classList.remove('active'));resetAll();
  await S(900);$('#s1').classList.add('active');mode='a';
});

/* ===== INIT ===== */
fillText();reserve();sprinkles();resize();buildTree();addEventListener('resize',resize);
requestAnimationFrame(loop);
</script>
